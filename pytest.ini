[pytest]
# Correction du sujet : sans pythonpath, « pytest » lancé seul ne trouve pas le
# paquet api (ModuleNotFoundError: No module named 'api'), notamment en CI.
pythonpath = .
testpaths = tests
# Les tests Selenium (marqueur e2e) demandent l'API lancée et Chrome :
# ils sont exclus par défaut et lancés avec « pytest -m e2e ».
addopts = -ra -m "not e2e"
markers =
    e2e: tests de bout en bout Selenium (API démarrée + navigateur Chrome)
    integration: tests qui entraînent réellement les modèles
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
