# Pipeline Logstash (PARTIE 20) : FastAPI ─► fichier JSON ─► Logstash ─► Elasticsearch
#
# L'API écrit une ligne JSON par événement dans /app/logs/api-<pid>.log ; ce dossier
# est un volume Docker partagé, monté ici en lecture seule dans /var/log/ml-churn.

input {
  file {
    # un fichier par worker uvicorn (api-<pid>.log) et leurs rotations (.1, .2…)
    path => ["/var/log/ml-churn/api*.log*"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-api"
    codec => json
  }
}

filter {
  # L'heure de l'événement est celle de l'API, pas celle de la lecture par Logstash
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  if [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }

  # Métadonnées techniques ajoutées par Logstash, inutiles dans Kibana
  # (event.original, chemin du fichier lu, nom d'hôte du conteneur Logstash)
  mutate {
    remove_field => ["event", "log", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
    data_stream => false
    manage_template => true
    template => "/usr/share/logstash/templates/ml-churn-logs.json"
    template_name => "ml-churn-logs"
    template_overwrite => true
  }
}
